services:
  tubearchivist:
    image: bbilly1/tubearchivist
    container_name: tubearchivist
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ta-media:/youtube
      - ta-cache:/cache
    environment:
      - ES_URL=http://archivist-es:9200
      - REDIS_CON=redis://archivist-redis:6379
      - HOST_UID=1000
      - HOST_GID=1000
      - TA_HOST=newnas.local 192.168.0.189
      - TA_USERNAME=tubearchivist
      - TA_PASSWORD=${TA_PASSWORD:-changeme}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - TZ=America/Los_Angeles
    depends_on:
      - archivist-es
      - archivist-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  archivist-redis:
    image: redis/redis-stack-server
    container_name: archivist-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - ta-redis:/data

  archivist-es:
    image: bbilly1/tubearchivist-es
    container_name: archivist-es
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=true
      - discovery.type=single-node
      - path.repo=/usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    expose:
      - "9200"
    volumes:
      - ta-es:/usr/share/elasticsearch/data

  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - metube-downloads:/downloads
    environment:
      - CORS_ALLOWED_ORIGINS=*

  image-api:
    build: ./image-api
    container_name: hoarder-catalog
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - images:/data/images
      - ta-media:/data/youtube:ro
      - metube-downloads:/data/media:ro
    environment:
      - TA_API_URL=http://tubearchivist:8000
      - TA_API_KEY=${TA_API_KEY}
      - METUBE_API_URL=http://metube:8081

volumes:
  ta-media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tank/media/archive/youtube
  ta-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tank/media/archive/youtube-cache
  ta-redis:
  ta-es:
  metube-downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tank/media/archive/metube
  images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tank/media/archive/images
